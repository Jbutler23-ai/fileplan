[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fileplan"
version = "0.1.0"
description = "Preview file organization and find destination conflicts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["files", "organization", "preview", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
fileplan = "fileplan:main"

[project.urls]
Repository = "https://github.com/Jbutler23-ai/fileplan"
Issues = "https://github.com/Jbutler23-ai/fileplan/issues"

[tool.setuptools]
py-modules = ["fileplan"]
packages = []
